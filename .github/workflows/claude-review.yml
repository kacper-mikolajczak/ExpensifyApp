name: PR Reviews with Claude Code

permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
    types: [opened, ready_for_review]
  # Test-fork enablement: run on demand against any PR number, from any branch
  # (so old vs new reviewer can be A/B'd by dispatching from different branches).
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

concurrency:
  group: claude-review-${{ github.event.pull_request.html_url || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Test fork: ONLY this account may trigger anything.
    if: |
      github.actor == 'kacper-mikolajczak'
      && (github.event_name == 'workflow_dispatch'
          || (github.event.pull_request.draft != true
              && !contains(github.event.pull_request.title, 'Revert')))
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Setup Claude review toolkit
        id: toolkit
        uses: Expensify/GitHub-Actions/.github/actions/claude-review-toolkit@2b751e9a86d8690f53443cce0ce886079eccea76

      - name: Mark review as in progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: addPrReaction.sh "$PR_NUMBER" "eyes"

      - name: Run Claude Code (code)
        id: code-review
        uses: anthropics/claude-code-action@4d7e1f0cd85743fdc93b1c8040ab54395da024e2 # v1.0.149
        with:
          display_report: "true"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          prompt: "/review-code-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
          claude_args: |
            --model claude-opus-4-8
            --allowedTools "Task,Glob,Grep,Read,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(check-compiler.sh:*)" --json-schema '${{ steps.toolkit.outputs.schema_json }}'
          # 1h cache TTL so the prefix survives the gap between runs (a run is longer than the 5-min default).
          settings: '{"env":{"ENABLE_PROMPT_CACHING_1H":"1"}}'

      - name: Post code review results
        if: steps.code-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          STRUCTURED_OUTPUT: ${{ steps.code-review.outputs.structured_output }}
        run: postCodeReviewResults.sh "$PR_NUMBER"

      - name: Remove in-progress indicator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: removePrReaction.sh "$PR_NUMBER" "eyes" "github-actions[bot]"
